# ==============================================================================
# Gatus Service Health & Status Page Configuration (dev2)
# ==============================================================================
# Declarative multi-host health monitoring with native Brevo SMTP alerting.
# ==============================================================================

ui:
  title: "Homelab Status | dev2"
  header: "Homelab Service Status"
  description: "Real-time automated service health, latency, and uptime dashboard"
  buttons:
    - name: "Beszel Health Hub"
      link: "https://dev2.tail256d6d.ts.net:8090"
    - name: "Obsidian Notes"
      link: "https://dev2.tail256d6d.ts.net:8083"
    - name: "Obsidian WebDAV"
      link: "https://dev1.tail256d6d.ts.net:8082/data/"
    - name: "Vaultwarden"
      link: "https://dev1.tail256d6d.ts.net"
    - name: "AdGuard Home"
      link: "https://dev1.tail256d6d.ts.net:8081"

storage:
  type: sqlite
  path: /data/gatus.db

alerting:
  email:
    host: "${SMTP_HOST}"
    port: 587
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
    from: "${SMTP_FROM}"
    to: "${ALERT_EMAIL}"

endpoints:
  # ============================================================================
  # Node: dev1 (Core Infrastructure & WebDAV Sync)
  # ============================================================================
  - name: "dev1 - Vaultwarden HTTPS"
    group: "dev1 - Core Infrastructure"
    url: "https://dev1.tail256d6d.ts.net/alive"
    interval: 60s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: email
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "dev1 Vaultwarden password manager is down or unreachable"

  - name: "dev1 - AdGuard Home Web"
    group: "dev1 - Core Infrastructure"
    url: "https://dev1.tail256d6d.ts.net:8081/login.html"
    interval: 60s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: email
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "dev1 AdGuard Home Web UI is down or unreachable"

  - name: "dev1 - Obsidian WebDAV Sync"
    group: "dev1 - Core Infrastructure"
    url: "https://dev1.tail256d6d.ts.net:8082/data/"
    interval: 60s
    client:
      insecure: true
    headers:
      Authorization: "Basic ${WEBDAV_BASIC_AUTH}"
    conditions:
      - "[STATUS] >= 200"
      - "[STATUS] < 400"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: email
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "dev1 Obsidian WebDAV sync endpoint is failing"

  - name: "dev1 - AdGuard DNS Service"
    group: "dev1 - Core Infrastructure"
    url: "100.69.247.60"
    interval: 60s
    dns:
      query-name: "google.com"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"
    alerts:
      - type: email
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "dev1 AdGuard DNS query resolution failed"

  - name: "dev1 - Caddy Reverse Proxy"
    group: "dev1 - Core Infrastructure"
    url: "tcp://100.69.247.60:443"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: email
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "dev1 Caddy Reverse Proxy TLS port 443 is unreachable"

  # ============================================================================
  # Node: dev2 (Knowledge Hub & Server Monitoring)
  # ============================================================================
  - name: "dev2 - Obsidian Web Editor"
    group: "dev2 - Knowledge & Server Monitoring"
    url: "http://obsidian_web:8080/"
    interval: 60s
    conditions:
      - "[STATUS] >= 200"
      - "[STATUS] < 400"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: email
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "dev2 Obsidian Flatnotes Web UI is down"

  - name: "dev2 - Beszel Health Hub"
    group: "dev2 - Knowledge & Server Monitoring"
    url: "http://beszel:8090/"
    interval: 60s
    conditions:
      - "[STATUS] >= 200"
      - "[STATUS] < 400"
      - "[RESPONSE_TIME] < 2000"
    alerts:
      - type: email
        failure-threshold: 3
        success-threshold: 2
        send-on-resolved: true
        description: "dev2 Beszel Server Health Hub is down"

  - name: "dev2 - Gatus Status Hub"
    group: "dev2 - Knowledge & Server Monitoring"
    url: "http://127.0.0.1:8080/"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 1000"
