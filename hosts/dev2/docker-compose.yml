services:
  obsidian_webdav:
    image: bytemark/webdav:latest
    container_name: obsidian_webdav
    restart: unless-stopped
    environment:
      - AUTH_TYPE=Basic
      - USERNAME=${WEBDAV_USERNAME:-obsidian}
      - PASSWORD=${WEBDAV_PASSWORD}
      - LOCATION=/data
    volumes:
      - /opt/homelab/data/dev2/obsidian/vault:/var/lib/dav/data
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - dev2_net
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.50'

  obsidian_web:
    image: dullage/flatnotes:latest
    container_name: obsidian_web
    restart: unless-stopped
    environment:
      - PUID=82
      - PGID=82
      - FLATNOTES_PATH=/data
      - FLATNOTES_SITE_TITLE=Obsidian Vault
      - FLATNOTES_AUTH_TYPE=${FLATNOTES_AUTH_TYPE:-password}
      - FLATNOTES_USERNAME=${FLATNOTES_USERNAME:-obsidian}
      - FLATNOTES_PASSWORD=${FLATNOTES_PASSWORD}
      - FLATNOTES_SECRET_KEY=${FLATNOTES_SECRET_KEY}
    volumes:
      - /opt/homelab/data/dev2/obsidian/vault:/data
      - /opt/homelab/data/dev2/obsidian/flatnotes_data:/app/data
    ports:
      - "127.0.0.1:8083:8080"
    networks:
      - dev2_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /opt/homelab/data/dev2/beszel/data:/beszel_data
      - /opt/homelab/data/dev2/beszel/socket:/beszel_socket
    networks:
      - dev2_net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  beszel_agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel_agent
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor:unconfined
    volumes:
      - /opt/homelab/data/dev2/beszel/socket:/beszel_socket
      - /opt/homelab/data/dev2/beszel/data:/beszel_data:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/run/systemd/private:/var/run/systemd/private:ro
      - /run/systemd/system:/run/systemd/system:ro
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - KEY_FILE=/beszel_data/id_ed25519.pub
      - KEY=${BESZEL_KEY:-}
      - SERVICE_PATTERNS=${SERVICE_PATTERNS:-docker*,tailscale*,ssh*,cron*,fail2ban*,homelab*}
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

networks:
  dev2_net:
    driver: bridge
