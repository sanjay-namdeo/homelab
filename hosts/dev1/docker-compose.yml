services:
  vaultwarden:
    image: vaultwarden/server:alpine
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=${SIGNUPS_ALLOWED:-false}
      - INVITATIONS_ALLOWED=false
      - LOG_FILE=/data/vaultwarden.log
      - EXTENDED_LOGGING=true
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Vaultwarden}
      - SMTP_TIMEOUT=${SMTP_TIMEOUT:-15}
      - SMTP_AUTH_MECHANISM=${SMTP_AUTH_MECHANISM:-Auto}
      - SMTP_ACCEPT_INVALID_CERTS=false
      - SMTP_ACCEPT_INVALID_HOSTNAMES=false
    volumes:
      - /opt/homelab/data/vaultwarden:/data
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /usr/share/zoneinfo/Asia/Kolkata:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - homelab_net
    ports:
      - "127.0.0.1:8080:80"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.75'

  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Kolkata}
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:53:53/tcp"
      - "${TAILSCALE_IP:-127.0.0.1}:53:53/udp"
      - "127.0.0.1:53:53/tcp"
      - "127.0.0.1:53:53/udp"
    volumes:
      - /opt/homelab/data/adguard/work:/opt/adguardhome/work
      - /opt/homelab/data/adguard/conf:/opt/adguardhome/conf
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /usr/share/zoneinfo/Asia/Kolkata:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/login.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.75'

  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      - TAILSCALE_FQDN=${TAILSCALE_FQDN}
    ports:
      - "80:80"
      - "443:443"
      - "${TAILSCALE_IP:-127.0.0.1}:8081:8081"
      - "127.0.0.1:8081:8081"
      - "${TAILSCALE_IP:-127.0.0.1}:8082:8082"
      - "127.0.0.1:8082:8082"
    volumes:
      - /opt/homelab/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/homelab/data/caddy/data:/data
      - /opt/homelab/data/caddy/config:/config
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /usr/share/zoneinfo/Asia/Kolkata:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.50'

  obsidian_webdav:
    image: bytemark/webdav:latest
    container_name: obsidian_webdav
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      - AUTH_TYPE=Basic
      - USERNAME=${WEBDAV_USERNAME:-obsidian}
      - PASSWORD=${WEBDAV_PASSWORD}
      - LOCATION=/data
    volumes:
      - /opt/homelab/data/obsidian/vault:/var/lib/dav/data
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /usr/share/zoneinfo/Asia/Kolkata:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - homelab_net
    healthcheck:
      test: ["CMD", "pidof", "httpd"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.50'

  beszel_agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel_agent
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor:unconfined
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/run/systemd/private:/var/run/systemd/private:ro
      - /run/systemd/system:/run/systemd/system:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /usr/share/zoneinfo/Asia/Kolkata:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      - PORT=45876
      - KEY=${BESZEL_KEY:-}
      - SERVICE_PATTERNS=${SERVICE_PATTERNS:-docker*,tailscale*,ssh*,fail2ban*,homelab*}
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

networks:
  homelab_net:
    driver: bridge
